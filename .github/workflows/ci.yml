# Replay farm copy of upstream's ci.yml: test CI only, read-only token, no secrets,
# no publish, deploy or comment steps. Generated by evals/scripts/replay-farm/overlay.ts; don't edit by hand.

name: CI

on:
  push:
    branches:
      - main
      - release-v*
  pull_request:

  merge_group:
    types:
      - checks_requested
permissions:
  contents: read

env:
  # disable remote cache on PRs because otherwise
  # they fail authentication to Vercel
  TURBO_CACHE: >-
    ${{ github.repository == 'vercel/ai' &&
        (github.event_name == 'push' ||
         (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) &&
        'local:rw,remote:rw' || 'local:rw' }}

jobs:
  jiffy-gate:
    name: Jiffy gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    outputs:
      run-all: ${{ steps.gate.outputs.run-all || 'true' }}
      tests: ${{ steps.gate.outputs.tests || '[]' }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - uses: rsyed94/jiffy@27fc5c2fdd33ad5d0ced231fbddb56155aaab5bd # action/v1
        id: gate
        continue-on-error: true
        with:
          service-url: https://jiffy-app-production.up.railway.app
          run-all: ${{ vars.JIFFY_RUN_ALL }}

  types:
    name: 'TypeScript'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: "Replay farm: restore upstream's CI files (upstream's tests read them)"
        shell: bash
        run: |
          set -eu
          cd "$GITHUB_WORKSPACE"
          src=.github/replay-farm/upstream
          [ -d "$src" ] || exit 0
          list="$RUNNER_TEMP/replay-farm-restore"
          (cd "$src" && find . -type f | sed 's|^\./||') > "$list"
          if git rev-parse --git-dir >/dev/null 2>&1; then
            git --literal-pathspecs ls-files -z -- .github/replay-farm | xargs -0 -r git --literal-pathspecs update-index --skip-worktree --
            exclude="$(git rev-parse --git-path info/exclude)"
            mkdir -p "$(dirname "$exclude")"
            while IFS= read -r f; do
              if git --literal-pathspecs ls-files --error-unmatch -- "$f" >/dev/null 2>&1; then
                git --literal-pathspecs update-index --skip-worktree -- "$f"
              else printf '/%s\n' "$(printf '%s' "$f" | sed -e 's/[][*?\\!#]/\\&/g' -e 's/ $/\\ /')" >> "$exclude"; fi
            done < "$list"
          fi
          cp -R "$src/." .
          rm -rf .github/replay-farm

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3
        with:
          runtime: node@22
          cache: true
          require-lockfile: true

      - name: Run TypeScript type check
        run: pnpm run type-check:full

  build-packages:
    needs:
      - jiffy-gate
    if: ${{ !cancelled() }}
    name: 'Build Packages'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      JIFFY_RUN_ALL: ${{ needs.jiffy-gate.outputs.run-all || 'true' }}
      JIFFY_TESTS: ${{ needs.jiffy-gate.outputs.tests || '[]' }}
      JIFFY_RECORD: ${{ github.event_name == 'merge_group' || (github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: "Replay farm: restore upstream's CI files (upstream's tests read them)"
        shell: bash
        run: |
          set -eu
          cd "$GITHUB_WORKSPACE"
          src=.github/replay-farm/upstream
          [ -d "$src" ] || exit 0
          list="$RUNNER_TEMP/replay-farm-restore"
          (cd "$src" && find . -type f | sed 's|^\./||') > "$list"
          if git rev-parse --git-dir >/dev/null 2>&1; then
            git --literal-pathspecs ls-files -z -- .github/replay-farm | xargs -0 -r git --literal-pathspecs update-index --skip-worktree --
            exclude="$(git rev-parse --git-path info/exclude)"
            mkdir -p "$(dirname "$exclude")"
            while IFS= read -r f; do
              if git --literal-pathspecs ls-files --error-unmatch -- "$f" >/dev/null 2>&1; then
                git --literal-pathspecs update-index --skip-worktree -- "$f"
              else printf '/%s\n' "$(printf '%s' "$f" | sed -e 's/[][*?\\!#]/\\&/g' -e 's/ $/\\ /')" >> "$exclude"; fi
            done < "$list"
          fi
          cp -R "$src/." .
          rm -rf .github/replay-farm

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3
        with:
          runtime: node@22
          cache: true
          require-lockfile: true

      - name: Set up Turborepo Remote Cache
        if: env.TURBO_CACHE == 'local:rw,remote:rw'
        uses: vercel/setup-turborepo-remote-cache-action@49d7b1b46ba4c9251e1977986bfe18336feabc8f # v1.1.0
        with:
          team: ${{ vars.TURBO_TEAM }}

      - name: Build packages
        run: pnpm run build:packages

      - name: Test MCP OAuth example
        run: pnpm --filter @example/next-openai test:mcp-auth

      - name: Archive package build artifacts
        run: tar -czf package-build-artifacts.tgz packages/*/dist

      - name: Upload package build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-build-artifacts
          path: package-build-artifacts.tgz
      - name: Keep Jiffy coverage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !cancelled() && env.JIFFY_RECORD == 'true' }}
        with:
          name: jiffy-coverage-${{ github.job }}-${{ strategy.job-index }}
          path: .jiffy/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 1
      - name: Keep test results for Jiffy
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !cancelled() }}
        with:
          name: jiffy-results-${{ github.job }}-${{ strategy.job-index }}
          path: .jiffy/results/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 30

  test_node_versions:
    name: 'Test Node Versions'
    runs-on: ubuntu-latest
    outputs:
      node_versions: ${{ steps.node-versions.outputs.node_versions }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: "Replay farm: restore upstream's CI files (upstream's tests read them)"
        shell: bash
        run: |
          set -eu
          cd "$GITHUB_WORKSPACE"
          src=.github/replay-farm/upstream
          [ -d "$src" ] || exit 0
          list="$RUNNER_TEMP/replay-farm-restore"
          (cd "$src" && find . -type f | sed 's|^\./||') > "$list"
          if git rev-parse --git-dir >/dev/null 2>&1; then
            git --literal-pathspecs ls-files -z -- .github/replay-farm | xargs -0 -r git --literal-pathspecs update-index --skip-worktree --
            exclude="$(git rev-parse --git-path info/exclude)"
            mkdir -p "$(dirname "$exclude")"
            while IFS= read -r f; do
              if git --literal-pathspecs ls-files --error-unmatch -- "$f" >/dev/null 2>&1; then
                git --literal-pathspecs update-index --skip-worktree -- "$f"
              else printf '/%s\n' "$(printf '%s' "$f" | sed -e 's/[][*?\\!#]/\\&/g' -e 's/ $/\\ /')" >> "$exclude"; fi
            done < "$list"
          fi
          cp -R "$src/." .
          rm -rf .github/replay-farm

      - name: Select Node versions
        id: node-versions
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo 'node_versions=[22,24,26]' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          git fetch --no-tags --depth=1 origin "$BASE_SHA"

          if git diff --name-only "$BASE_SHA" "${{ github.sha }}" | grep -E '^packages/[^/]+/(src/|test/|tests/|.*\.test(-d)?\.(ts|tsx|js|jsx)$)'; then
            echo 'node_versions=[22,24,26]' >> "$GITHUB_OUTPUT"
          else
            echo 'node_versions=[22]' >> "$GITHUB_OUTPUT"
          fi

  test_matrix:
    name: 'Test'
    runs-on: ubuntu-latest
    needs: [build-packages, test_node_versions]
    permissions:
      contents: read
      id-token: write
    strategy:
      matrix:
        node-version: ${{ fromJSON(needs.test_node_versions.outputs.node_versions) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: "Replay farm: restore upstream's CI files (upstream's tests read them)"
        shell: bash
        run: |
          set -eu
          cd "$GITHUB_WORKSPACE"
          src=.github/replay-farm/upstream
          [ -d "$src" ] || exit 0
          list="$RUNNER_TEMP/replay-farm-restore"
          (cd "$src" && find . -type f | sed 's|^\./||') > "$list"
          if git rev-parse --git-dir >/dev/null 2>&1; then
            git --literal-pathspecs ls-files -z -- .github/replay-farm | xargs -0 -r git --literal-pathspecs update-index --skip-worktree --
            exclude="$(git rev-parse --git-path info/exclude)"
            mkdir -p "$(dirname "$exclude")"
            while IFS= read -r f; do
              if git --literal-pathspecs ls-files --error-unmatch -- "$f" >/dev/null 2>&1; then
                git --literal-pathspecs update-index --skip-worktree -- "$f"
              else printf '/%s\n' "$(printf '%s' "$f" | sed -e 's/[][*?\\!#]/\\&/g' -e 's/ $/\\ /')" >> "$exclude"; fi
            done < "$list"
          fi
          cp -R "$src/." .
          rm -rf .github/replay-farm

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3
        with:
          runtime: node@${{ matrix.node-version }}
          cache: true
          require-lockfile: true

      - name: Download package build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package-build-artifacts

      - name: Extract package build artifacts
        run: tar -xzf package-build-artifacts.tgz

      - name: Set up Turborepo Remote Cache
        if: env.TURBO_CACHE == 'local:rw,remote:rw'
        uses: vercel/setup-turborepo-remote-cache-action@49d7b1b46ba4c9251e1977986bfe18336feabc8f # v1.1.0
        with:
          team: ${{ vars.TURBO_TEAM }}
      - name: "Replay farm: fetch the PR base for Tensile"
        if: ${{ github.event_name == 'pull_request' }}
        continue-on-error: true
        shell: bash
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$(git rev-parse --is-shallow-repository)" = true ]; then
            git fetch --no-tags --quiet --depth=100 origin "$BASE" "$GITHUB_SHA"
          fi
      - name: Tensile selection (shadow)
        id: tensile
        uses: rsyed94/tensile-action@05313adc9733cfd37a2a1e5efc192a492bf6298b
        continue-on-error: true
        with:
          phase: select
          mode: shadow
          runner: vitest
          service-url: https://jiffy-app-production.up.railway.app
          check-run-id: ${{ job.check_run_id }}
          matrix-key: ${{ toJSON(matrix) }}
          test-step: Run tests
          report: .jiffy/no-report.json

      - name: Run tests
        env:
          SKIP_RSC_E2E: '1'
          # Turbo parallelizes packages; keep each Vitest worker pool bounded.
          VITEST_MAX_WORKERS: '2'
          # Test results must not be reused across the Node version matrix.
          TEST_NODE_VERSION: ${{ matrix.node-version }}
        run: pnpm test:ci

  test_ai_matrix:
    needs:
      - jiffy-gate
    if: ${{ !cancelled() }}
    name: 'Test AI'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        node-version: [22, 24, 26]
        shard: ['1/4', '2/4', '3/4', '4/4']
    env:
      JIFFY_RUN_ALL: ${{ needs.jiffy-gate.outputs.run-all || 'true' }}
      JIFFY_TESTS: ${{ needs.jiffy-gate.outputs.tests || '[]' }}
      JIFFY_RECORD: ${{ github.event_name == 'merge_group' || (github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: "Replay farm: restore upstream's CI files (upstream's tests read them)"
        shell: bash
        run: |
          set -eu
          cd "$GITHUB_WORKSPACE"
          src=.github/replay-farm/upstream
          [ -d "$src" ] || exit 0
          list="$RUNNER_TEMP/replay-farm-restore"
          (cd "$src" && find . -type f | sed 's|^\./||') > "$list"
          if git rev-parse --git-dir >/dev/null 2>&1; then
            git --literal-pathspecs ls-files -z -- .github/replay-farm | xargs -0 -r git --literal-pathspecs update-index --skip-worktree --
            exclude="$(git rev-parse --git-path info/exclude)"
            mkdir -p "$(dirname "$exclude")"
            while IFS= read -r f; do
              if git --literal-pathspecs ls-files --error-unmatch -- "$f" >/dev/null 2>&1; then
                git --literal-pathspecs update-index --skip-worktree -- "$f"
              else printf '/%s\n' "$(printf '%s' "$f" | sed -e 's/[][*?\\!#]/\\&/g' -e 's/ $/\\ /')" >> "$exclude"; fi
            done < "$list"
          fi
          cp -R "$src/." .
          rm -rf .github/replay-farm

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3
        with:
          runtime: node@${{ matrix.node-version }}
          cache: true
          require-lockfile: true

      - name: Set up Turborepo Remote Cache
        if: env.TURBO_CACHE == 'local:rw,remote:rw'
        uses: vercel/setup-turborepo-remote-cache-action@49d7b1b46ba4c9251e1977986bfe18336feabc8f # v1.1.0
        with:
          team: ${{ vars.TURBO_TEAM }}

      - name: Build AI dependencies
        run: pnpm exec turbo build --filter=ai

      - name: Run AI tests
        working-directory: packages/ai
        run: |
          pnpm test:node --shard ${{ matrix.shard }}
          pnpm test:edge --shard ${{ matrix.shard }}
      - name: Keep Jiffy coverage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !cancelled() && env.JIFFY_RECORD == 'true' }}
        with:
          name: jiffy-coverage-${{ github.job }}-${{ strategy.job-index }}
          path: .jiffy/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 1
      - name: Keep test results for Jiffy
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !cancelled() }}
        with:
          name: jiffy-results-${{ github.job }}-${{ strategy.job-index }}
          path: .jiffy/results/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 30

  test_codemod_matrix:
    needs:
      - jiffy-gate
    if: ${{ !cancelled() }}
    name: 'Test Codemod'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24, 26]
        shard: ['1/4', '2/4', '3/4', '4/4']
    env:
      JIFFY_RUN_ALL: ${{ needs.jiffy-gate.outputs.run-all || 'true' }}
      JIFFY_TESTS: ${{ needs.jiffy-gate.outputs.tests || '[]' }}
      JIFFY_RECORD: ${{ github.event_name == 'merge_group' || (github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: "Replay farm: restore upstream's CI files (upstream's tests read them)"
        shell: bash
        run: |
          set -eu
          cd "$GITHUB_WORKSPACE"
          src=.github/replay-farm/upstream
          [ -d "$src" ] || exit 0
          list="$RUNNER_TEMP/replay-farm-restore"
          (cd "$src" && find . -type f | sed 's|^\./||') > "$list"
          if git rev-parse --git-dir >/dev/null 2>&1; then
            git --literal-pathspecs ls-files -z -- .github/replay-farm | xargs -0 -r git --literal-pathspecs update-index --skip-worktree --
            exclude="$(git rev-parse --git-path info/exclude)"
            mkdir -p "$(dirname "$exclude")"
            while IFS= read -r f; do
              if git --literal-pathspecs ls-files --error-unmatch -- "$f" >/dev/null 2>&1; then
                git --literal-pathspecs update-index --skip-worktree -- "$f"
              else printf '/%s\n' "$(printf '%s' "$f" | sed -e 's/[][*?\\!#]/\\&/g' -e 's/ $/\\ /')" >> "$exclude"; fi
            done < "$list"
          fi
          cp -R "$src/." .
          rm -rf .github/replay-farm

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3
        with:
          runtime: node@${{ matrix.node-version }}
          cache: true
          require-lockfile: true

      - name: Run codemod tests
        working-directory: packages/codemod
        run: pnpm exec vitest --config vitest.config.ts --run --shard ${{ matrix.shard }}
      - name: Keep Jiffy coverage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !cancelled() && env.JIFFY_RECORD == 'true' }}
        with:
          name: jiffy-coverage-${{ github.job }}-${{ strategy.job-index }}
          path: .jiffy/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 1
      - name: Keep test results for Jiffy
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !cancelled() }}
        with:
          name: jiffy-results-${{ github.job }}-${{ strategy.job-index }}
          path: .jiffy/results/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 30

  jiffy-upload:
    name: Jiffy coverage upload
    needs:
      - build-packages
      - test_ai_matrix
      - test_codemod_matrix
    if: ${{ !cancelled() && (github.event_name == 'merge_group' || (github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          pattern: jiffy-coverage-*
          path: jiffy-coverage
      - name: Upload coverage to Jiffy
        shell: bash
        env:
          JIFFY_SERVER: https://jiffy-app-production.up.railway.app
        run: |
          set -euo pipefail
          shopt -s nullglob
          token=$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=jiffy" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).value))')
          echo "::add-mask::$token"
          put() { curl -sSf -X PUT -H "Authorization: Bearer $token" -H "content-type: application/json" --data-binary @"$1" "$JIFFY_SERVER/v1/maps/$GITHUB_REPOSITORY/$GITHUB_SHA/$2/$3"; }
          for dir in jiffy-coverage/*/; do
            job=$(basename "$dir")
            for f in "$dir"coverage-*.json; do case "$f" in *-nodes.json | *-nodes.always-run.json) continue ;; esac; put "$f" parts "$job-$(basename "$f" .json)"; done
            for f in "$dir"report-*.json; do put "$f" durations "$job-$(basename "$f" .json)"; done
          done
